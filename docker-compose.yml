# The whole app on one HTTPS URL via ngrok:
#
#   https://superordinary-unvended-lean.ngrok-free.dev
#
# Put NGROK_AUTHTOKEN=... in .env (with the rest of the backend settings), then
#   docker compose up --build
#
# Locally the same app is on http://localhost:3000 (localhost counts as a secure
# context, so the mic works there too). ngrok inspector: localhost:4040.

services:
  backend:
    build: .
    env_file: .env
    environment:
      # Annotated photo links in replies; must be reachable from the farmer's phone.
      PUBLIC_BASE_URL: https://superordinary-unvended-lean.ngrok-free.dev
    ports:
      - "3000:2024"
    volumes:
      - data:/app/.data
      - media:/app/.media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2024/health')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "backend:2024", "--url", "https://superordinary-unvended-lean.ngrok-free.dev"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env}
    ports:
      - "4040:4040"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
  media:
